# Weekly update pull requests. Security fixes come as soon as GitHub
# publishes them (Dependabot security updates, turned on in the settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the pieces that move together.
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', 'ng-packagr']
      prosemirror:
        patterns: ['prosemirror-*']
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
