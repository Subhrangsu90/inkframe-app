name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Icon font subset is up to date
        run: npm run icons:check

      - name: Unit tests (library and app)
        run: npm test

      - name: Build library
        run: npm run build:lib:prod

      - name: Build app
        run: npm run build:app:prod

      - name: No third-party resources in the app
        run: node scripts/check-no-third-party.mjs dist/inkframe-app/browser
