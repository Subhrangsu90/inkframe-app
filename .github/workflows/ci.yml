name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit (a tag can be moved); Dependabot keeps the pins current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Known vulnerabilities (high and critical fail)
        run: npm audit --audit-level=high

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Icon font subset is up to date
        run: npm run icons:check

      - name: Unit tests (library and app)
        run: npm test

      - name: Build library
        run: npm run build:lib:prod

      # Also adds each page's Content Security Policy (scripts/add-csp.mjs) and fails on inline handlers.
      - name: Build app
        run: npm run build:app:prod

      - name: No third-party resources in the app
        run: node scripts/check-no-third-party.mjs dist/inkframe-app/browser

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every commit: a secret deleted later is still in the history.
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum checked)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the history
        run: ./gitleaks git . --redact --no-banner
