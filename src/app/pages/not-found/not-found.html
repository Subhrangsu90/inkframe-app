<ng-template #headerLeft>
  <div class="flex items-center gap-2">
    <span class="font-bold text-[14px] text-ink-text-heading">Page Not Found</span>
  </div>
</ng-template>

<div class="flex-1 flex flex-col items-center justify-center p-8 text-center min-h-[400px]">
  <div
    class="w-16 h-16 rounded-full bg-ink-surface-2 flex items-center justify-center text-ink-text-muted mb-4 border border-ink-border"
  >
    <span class="font-mono text-2xl font-bold">404</span>
  </div>
  <h2 class="text-xl font-bold text-ink-text-heading mb-2">Page Not Found</h2>
  <p class="text-sm text-ink-text-muted max-w-sm mb-6">
    The note or destination you're looking for doesn't exist or was moved.
  </p>
  <a
    routerLink="/docs"
    class="px-4 py-2 rounded-ink-md bg-ink-accent text-white text-xs font-semibold hover:bg-ink-accent-hover transition-colors inline-flex items-center gap-2"
  >
    <ink-icon name="arrow-right" [size]="14" />
    <span>Return to Documents</span>
  </a>
</div>
